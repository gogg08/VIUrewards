# Diagnóstico del runner de Windows para los E2E de procesos.
#
# Por qué existe: cuatro ejecuciones del workflow de empaquetado se quedaron
# `in_progress` en el paso "E2E · tabla de procesos", algunas sin logs ni
# artefactos. Este workflow NO empaqueta ni publica nada: sirve para separar
# "el entorno del runner se agota o pierde comunicación" de "el helper de
# limpieza toca procesos que no debe".
#
# Qué produce: por cada job, un artefacto con logs escritos incrementalmente
# (`if: always()`), para que sobreviva algo aunque el job falle.
#
# Qué NO hace:
#   - NO termina procesos: ni `taskkill`, ni `/T`, ni `Stop-Process`, ni señales
#     por PID. El watchdog solo OBSERVA.
#   - NO toca el workflow de empaquetado ni sus condiciones.
#   - NO crea tags ni releases, y solo lee el repositorio.
#
# LIMITACIÓN CENTRAL: si el agente de GitHub Actions deja de funcionar (que es
# una de las hipótesis del incidente), ningún timeout dentro del runner se
# aplica ni se sube el artefacto. Esos límites ayudan cuando el agente sigue
# vivo; no garantizan la recuperación cuando no lo está.
name: Diagnóstico del runner (Windows)

on:
  workflow_dispatch:
  # Temporal, SOLO para investigar el cuelgue del paso 11 de
  # package-windows.yml (anotación: "hosted runner lost communication with the
  # server"). Se quita al cerrar el diagnóstico.
  push:
    branches:
      - wip/ci-hang-diag

permissions:
  contents: read

concurrency:
  group: diag-windows-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # a. Entorno: sin tests, sin `npm ci`. Solo lee datos del sistema.
  # ───────────────────────────────────────────────────────────────────────────
  env:
    name: Diagnóstico · entorno
    runs-on: windows-latest
    # Presupuesto: checkout 1 + script 2 + subida 1 = 4 + 1 de margen.
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false

      # No necesita dependencias: el script solo usa cmdlets del sistema.
      - name: Recoger datos del entorno
        timeout-minutes: 2
        run: |
          $logDir = Join-Path $env:RUNNER_TEMP "diag-env"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          & ".github/scripts/diag-env.ps1" -LogDir $logDir
          if ($LASTEXITCODE -ne 0) { throw "diag-env.ps1 termino con codigo $LASTEXITCODE" }

      - name: Subir los registros del entorno
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: diag-env-${{ github.run_id }}
          path: ${{ runner.temp }}/diag-env/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0

  # ───────────────────────────────────────────────────────────────────────────
  # b. Dry-run de la limpieza: DESHABILITADO a propósito.
  #
  # El helper de limpieza todavía no expone un modo de solo cálculo de
  # objetivos (`tests/e2e/helpers/dry-run.ts` no existe). Habilitar una
  # simulación de limpieza antes de que la guarda esté revisada y aprobada
  # sería peor que no tenerla. Cuando exista, este job solo imprimirá la lista
  # de objetivos y fallará si incluye al proceso actual, a un ancestro o a un
  # proceso del runner.
  # ───────────────────────────────────────────────────────────────────────────
  kill-dry-run:
    name: Diagnóstico · dry-run de limpieza (deshabilitado)
    if: false
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - name: Deshabilitado a propósito
        run: 'Write-Host "[ci-diag] kill-dry-run deshabilitado: la guarda de PID no está aprobada."'

  # ───────────────────────────────────────────────────────────────────────────
  # c. E2E · tabla de procesos, observado por el watchdog.
  # ───────────────────────────────────────────────────────────────────────────
  proc-table-staged:
    name: Diagnóstico · E2E tabla de procesos
    runs-on: windows-latest
    # Presupuesto: checkout 1 + setup-node 1 + npm ci 3 + watchdog 5 + subida 1
    # = 11 + 1 de margen.
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Node.js
        timeout-minutes: 1
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependencias
        timeout-minutes: 3
        run: npm ci --no-audit --no-fund

      # El paso dura MENOS que el job: el watchdog se corta a los 220 s y el
      # paso a 280 s, así quedan ~1 minuto para subir el artefacto.
      - name: E2E observado · tabla de procesos
        timeout-minutes: 5
        run: |
          $logDir = Join-Path $env:RUNNER_TEMP "diag-e2e"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          & ".github/scripts/diag-e2e-watchdog.ps1" `
            -TestFile "tests/e2e/proc-table.test.ts" `
            -LogDir $logDir `
            -HardLimitSec 220 `
            -HeartbeatSec 10
          $code = $LASTEXITCODE
          Write-Host "[ci-diag] watchdog exit=$code"
          if ($code -eq 2) { throw "El watchdog alcanzó el límite duro sin que el proceso de prueba terminara." }
          if ($code -ne 0) { throw "No se pudo lanzar el watchdog (código $code)." }
          # El resultado de Vitest NO se pierde: el watchdog informa el código
          # del proceso de prueba en su archivo .exit.txt. Se falla el paso para
          # que el job quede marcado; el artefacto se sube igual (`always()`).
          $exitFile = Get-ChildItem -LiteralPath $logDir -Filter "proc-table*.exit.txt" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $exitFile) {
            throw "El watchdog no dejó archivo .exit.txt: no hay evidencia de cómo terminó el proceso de prueba."
          }
          $recorded = (Get-Content -LiteralPath $exitFile.FullName -Raw).Trim()
          Write-Host "[ci-diag] resultado del proceso de prueba: $recorded"
          if ($recorded -ne "exit=0") {
            throw "El proceso de prueba terminó con '$recorded'."
          }

      - name: Subir los registros del E2E
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: diag-proc-table-${{ github.run_id }}
          path: ${{ runner.temp }}/diag-e2e/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0

  # ───────────────────────────────────────────────────────────────────────────
  # d. E2E · cierre ordenado, observado por el watchdog.
  # ───────────────────────────────────────────────────────────────────────────
  shutdown-staged:
    name: Diagnóstico · E2E cierre ordenado
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Node.js
        timeout-minutes: 1
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependencias
        timeout-minutes: 3
        run: npm ci --no-audit --no-fund

      - name: E2E observado · cierre ordenado
        timeout-minutes: 5
        run: |
          $logDir = Join-Path $env:RUNNER_TEMP "diag-e2e"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          & ".github/scripts/diag-e2e-watchdog.ps1" `
            -TestFile "tests/e2e/shutdown.test.ts" `
            -LogDir $logDir `
            -HardLimitSec 220 `
            -HeartbeatSec 10
          $code = $LASTEXITCODE
          Write-Host "[ci-diag] watchdog exit=$code"
          if ($code -eq 2) { throw "El watchdog alcanzó el límite duro sin que el proceso de prueba terminara." }
          if ($code -ne 0) { throw "No se pudo lanzar el watchdog (código $code)." }
          $exitFile = Get-ChildItem -LiteralPath $logDir -Filter "shutdown*.exit.txt" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $exitFile) {
            throw "El watchdog no dejó archivo .exit.txt: no hay evidencia de cómo terminó el proceso de prueba."
          }
          $recorded = (Get-Content -LiteralPath $exitFile.FullName -Raw).Trim()
          Write-Host "[ci-diag] resultado del proceso de prueba: $recorded"
          if ($recorded -ne "exit=0") {
            throw "El proceso de prueba terminó con '$recorded'."
          }

      - name: Subir los registros del E2E
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: diag-shutdown-${{ github.run_id }}
          path: ${{ runner.temp }}/diag-e2e/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0

  # ───────────────────────────────────────────────────────────────────────────
  # e. REPRODUCCIÓN del cuelgue original de `package-windows.yml`.
  #
  # Por qué existe: los jobs c/d corren el E2E en un entorno que NO es el de
  # producción (sin `choco install ffmpeg`, con Node "24" genérico, sin el
  # `npm ci` completo previo). Los runs históricos 40252989076 y 40347730549 se
  # bloquearon en `E2E · cierre ordenado` con anotación de GitHub "hosted runner
  # lost communication with the server", y no quedaron logs (BlobNotFound).
  #
  # Qué reproduce del paso real (`package-windows.yml` @ 312f42eb):
  #   - Node de la versión FIJADA, leída de `scripts/dist/config.ts`, igual que
  #     el paso "Leer las versiones fijadas" de producción.
  #   - `npm ci --no-audit --no-fund`.
  #   - `choco install ffmpeg -y --no-progress` + verificación de ffmpeg/ffprobe.
  #   - El MISMO archivo y el MISMO comando: `npx vitest run --config
  #     vitest.e2e.config.ts tests/e2e/shutdown.test.ts`.
  #   - El MISMO shell del paso: producción declara `defaults.run.shell: pwsh`.
  #     La acción `pwsh` de GitHub escribe el bloque `run:` en un archivo
  #     temporal `.ps1` y ejecuta `pwsh -command ". '<ruta>'"`; el supervisor
  #     hace lo mismo con el comando autorizado (no con `cmd.exe /c`).
  #     DIFERENCIAS CONOCIDAS: el supervisor agrega `-NoProfile` y
  #     `-NonInteractive`, y su proceso padre es el propio supervisor, no el
  #     agente del runner. No se afirma fidelidad exacta del entorno.
  #
  # Diferencia deliberada: el proceso queda dentro de un Windows Job Object con
  # `JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE` (`.github/scripts/diag-job-watchdog.ps1`),
  # lanzado SUSPENDIDO y asignado antes de reanudarlo. Esto es una EXCEPCION
  # autorizada a la política "no terminar procesos por PID": al cerrar el handle
  # del job, el SO termina los procesos que contiene. NO se usa `taskkill`,
  # `Stop-Process` ni terminación manual por PID, y NO se identifica ningún
  # proceso a mano: el job contiene el árbol por construcción.
  #
  # Ventana: el watchdog tiene un límite duro de 55 min (3300 s), por encima de
  # los 41-49 min en que se bloquearon los runs históricos. Al alcanzarlo,
  # escribe PRIMERO la instantánea (root + descendientes por PPID, sin
  # `CommandLine`) y el motivo, y RECIÉN DESPUÉS cierra el job. Si el proceso
  # termina solo, deja `exit=<codigo>` en el `.exit.txt`.
  #
  # Presupuesto de tiempo (el comentario NO puede prometer lo que no cabe):
  #   checkout 1 + versiones 1 + setup-node 2 + npm ci 4 + choco 5 = 13
  #   ejecución 55 + holgura del paso 10 = 65 (timeout del paso)
  #   13 + 65 + subida 1 = 79 -> el job lleva 85 min para dejar 6 de margen.
  #   Queda 65-55 = 10 min de holgura DENTRO del paso para que el watchdog
  #   cierre el job, escriba la instantánea y el paso termine por sí solo.
  #
  # LIMITACIONES (no se promete más):
  #   1. Si el AGENTE del runner pierde comunicación con GitHub, no se ejecuta
  #      ni el límite duro, ni el cierre del job, ni la subida del artefacto. Es
  #      el mismo modo de fallo que en producción y este experimento NO lo cubre.
  #   2. Si `AssignProcessToJobObject` falla (jobs anidados del runner), el
  #      supervisor sale con código 3 SIN ejecutar la prueba: no se degrada a
  #      ejecutarla fuera del job.
  #   3. El experimento no reproduce el resto del workflow (typecheck, unitarios,
  #      los otros E2E ni el empaquetado): aísla solo el paso de cierre ordenado.
  # ───────────────────────────────────────────────────────────────────────────
  shutdown-repro:
    name: Reproducción · E2E cierre ordenado (contexto de producción)
    runs-on: windows-latest
    timeout-minutes: 85
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Igual que producción: la versión de Node se lee del único lugar que la
      # fija. `better-sqlite3` se liga a un ABI concreto y el E2E de cierre
      # arranca el servidor real, así que una versión distinta cambia el entorno.
      - name: Leer las versiones fijadas
        id: versions
        timeout-minutes: 1
        run: |
          $config = Get-Content -Raw -LiteralPath "scripts/dist/config.ts"
          $match = [regex]::Match($config, 'NODE_VERSION\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"')
          if (-not $match.Success) {
            throw "No se pudo leer NODE_VERSION de scripts/dist/config.ts"
          }
          $node = $match.Groups[1].Value
          Write-Output "node=$node" >> $env:GITHUB_OUTPUT
          Write-Host "Node fijado: $node"

      - name: Preparar Node.js fijado
        timeout-minutes: 2
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Instalar dependencias
        timeout-minutes: 4
        run: npm ci --no-audit --no-fund

      # Reproduce el paso 10 de producción, que es el que precede al E2E en
      # todos los runs que se colgaron. Si falla, el paso FALLA (no se omite).
      - name: Herramientas de medios (como producción)
        timeout-minutes: 5
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      # Mismo archivo y mismo comando que producción (`npx vitest ...`), bajo el
      # shell `pwsh` del paso real, pero dentro de un Job Object. El supervisor
      # recibe el comando EXACTO; no compone un argv distinto.
      #
      # Códigos del supervisor: 0 = la prueba terminó (su código queda en
      # `.exit.txt`), 2 = límite duro (instantánea + cierre del job), 3 = no se
      # pudo crear/asignar el job o lanzar el proceso (la prueba NO se ejecutó).
      - name: E2E observado · cierre ordenado (reproducción)
        timeout-minutes: 65
        run: |
          $logDir = Join-Path $env:RUNNER_TEMP "diag-e2e-repro"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          & ".github/scripts/diag-job-watchdog.ps1" `
            -TestFile "tests/e2e/shutdown.test.ts" `
            -CommandLine "npx vitest run --config vitest.e2e.config.ts tests/e2e/shutdown.test.ts" `
            -LogDir $logDir `
            -HardLimitSec 3300 `
            -HeartbeatSec 10 `
            -SnapshotEverySec 60
          $code = $LASTEXITCODE
          Write-Host "[ci-diag] supervisor exit=$code"
          if ($code -eq 2) {
            throw "Se alcanzó el límite duro de 55 min: la instantánea y el cierre del job quedaron en el artefacto."
          }
          if ($code -ne 0) {
            throw "No se pudo lanzar la prueba bajo el Job Object (código $code); la prueba no se ejecutó."
          }
          # Un 0 del supervisor solo significa "la prueba terminó": el resultado
          # real de Vitest está en el .exit.txt y se comprueba acá para no
          # reintroducir el falso verde.
          # El nombre real lo produce el supervisor con
          # `GetFileNameWithoutExtension($TestFile) + "-job-" + $stamp`:
          # `GetFileNameWithoutExtension("tests/e2e/shutdown.test.ts")` es
          # `shutdown.test`, asi que el archivo es
          # `shutdown.test-job-<stamp>.exit.txt`.
          # Por eso el patron es `shutdown*.exit.txt`: el comodin cubre
          # `.test-job-<stamp>` y no depende de cuantos puntos tenga el nombre.
          # Un patron con `.job-` literal NO coincide (el separador real es
          # `.test` antes de `-job-`).
          $exitFile = Get-ChildItem -LiteralPath $logDir -Filter "shutdown*.exit.txt" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $exitFile) {
            throw "El supervisor no dejó archivo .exit.txt: no hay evidencia de cómo terminó el proceso de prueba."
          }
          $recorded = (Get-Content -LiteralPath $exitFile.FullName -Raw).Trim()
          Write-Host "[ci-diag] resultado del proceso de prueba: $recorded"
          if ($recorded -ne "exit=0") {
            throw "El proceso de prueba terminó con '$recorded'."
          }

      - name: Subir los registros de la reproducción
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: diag-shutdown-repro-${{ github.run_id }}
          path: ${{ runner.temp }}/diag-e2e-repro/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
