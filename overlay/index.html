<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>czero-rewards overlay</title>
    <style>
      /* Fondo transparente: es un Browser Source que se compone sobre el video. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      /* El anclaje se ubica en la posición pedida y centra el video sobre ese punto. */
      #anchor {
        position: absolute;
        transform: translate(-50%, -50%);
      }
      #clip {
        display: none;
        max-width: 100vw;
        max-height: 100vh;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="anchor">
        <video id="clip" playsinline></video>
      </div>
    </div>

    <script>
      const anchor = document.getElementById("anchor");
      const video = document.getElementById("clip");

      /** Keyframes de entrada; la salida es la misma animación al revés. */
      const ENTER = {
        none: [{ opacity: 1 }, { opacity: 1 }],
        fade: [{ opacity: 0 }, { opacity: 1 }],
        "slide-up": [
          { opacity: 0, transform: "translateY(30px)" },
          { opacity: 1, transform: "translateY(0)" },
        ],
        "slide-down": [
          { opacity: 0, transform: "translateY(-30px)" },
          { opacity: 1, transform: "translateY(0)" },
        ],
        zoom: [
          { opacity: 0, transform: "scale(0.8)" },
          { opacity: 1, transform: "scale(1)" },
        ],
      };

      let current = null;
      let anim = null;
      let endTimer = null;
      let reconnectTimer = null;
      let ws = null;

      function send(message) {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(message));
      }

      function clearTimers() {
        if (endTimer !== null) clearTimeout(endTimer);
        endTimer = null;
      }

      function animateIn(name) {
        if (anim) anim.cancel();
        anim = video.animate(ENTER[name] ?? ENTER.fade, {
          duration: 300,
          easing: "ease-out",
          fill: "forwards",
        });
      }

      function animateOut(name) {
        if (anim) anim.cancel();
        anim = video.animate([...(ENTER[name] ?? ENTER.fade)].reverse(), {
          duration: 250,
          easing: "ease-in",
          fill: "forwards",
        });
      }

      function play(item, url) {
        if (current && current.id === item.id && !video.paused) return;
        clearTimers();
        current = item;

        const p = item.params;
        anchor.style.left = p.position.x * 100 + "%";
        anchor.style.top = p.position.y * 100 + "%";
        video.volume = Math.min(1, Math.max(0, p.volume));
        video.style.display = "block";

        if (video.getAttribute("src") !== url) video.setAttribute("src", url);
        animateIn(p.enterAnimation);

        const started = video.play();
        if (started && typeof started.catch === "function") {
          started.catch((error) => send({ type: "error", itemId: item.id, message: String(error) }));
        }

        // Corta el video aunque no haya terminado (duración máxima).
        endTimer = setTimeout(() => finish(item.id), Math.max(1, p.maxDurationSec) * 1000);
      }

      function finish(itemId) {
        if (!current || current.id !== itemId) return;
        send({ type: "ended", itemId: itemId });
        hide();
        current = null;
      }

      function hide() {
        clearTimers();
        animateOut(current ? current.params.exitAnimation : "fade");
        video.pause();
        setTimeout(() => {
          if (!current) video.style.display = "none";
        }, 250);
      }

      function stop() {
        current = null;
        hide();
      }

      video.addEventListener("ended", () => {
        if (current) finish(current.id);
      });

      function handle(message) {
        switch (message.type) {
          case "state":
            if (message.state.current && message.state.status === "playing") {
              play(message.state.current, "/media/" + encodeURIComponent(message.state.current.clipId) + ".mp4");
            } else {
              stop();
            }
            break;
          case "play":
            play(message.item, message.url);
            break;
          case "stop":
            stop();
            break;
          case "pause":
            clearTimers();
            video.pause();
            break;
          case "resume":
            if (current) video.play().catch(() => {});
            break;
        }
      }

      function connect() {
        ws = new WebSocket("ws://" + location.host + "/ws");
        ws.addEventListener("open", () => send({ type: "ready" }));
        ws.addEventListener("message", (event) => {
          try {
            handle(JSON.parse(event.data));
          } catch {
            /* mensaje no reconocido: se ignora */
          }
        });
        // Reconexión automática si se corta el socket.
        ws.addEventListener("close", () => {
          stop();
          if (reconnectTimer !== null) clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(connect, 2000);
        });
        ws.addEventListener("error", () => ws.close());
      }

      connect();
    </script>
  </body>
</html>
