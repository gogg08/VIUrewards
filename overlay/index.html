<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VIUrewards overlay</title>
    <!-- Evita el 404 de /favicon.ico dentro del Browser Source. -->
    <link rel="icon" href="data:," />
    <style>
      :root {
        --toast-bg: rgba(0, 0, 0, 0.8);
        --toast-ink: #ffffff;
      }
      /* Fondo transparente: es un Browser Source que se compone sobre el video. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      /* El video llena el área de la fuente (Browser Source) respetando su
         relación de aspecto. Las barras sobrantes son transparentes, no negras.
         El tamaño y la ubicación de la alerta se ajustan en OBS moviendo y
         redimensionando la fuente. La posición X/Y de la recompensa ya no se
         aplica (queda reservada para más adelante). */
      #anchor {
        position: absolute;
        inset: 0;
      }
      #clip {
        display: none;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: transparent;
      }
      /* Cartel de la alerta de prueba (Ajustes → Overlay y OBS). */
      #toast {
        display: none;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        padding: 1rem 1.5rem;
        border-radius: 12px;
        background: var(--toast-bg);
        color: var(--toast-ink);
        font-family: system-ui, sans-serif;
        font-size: 32px;
        text-align: center;
      }
      #toast.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="anchor">
        <video id="clip" playsinline></video>
      </div>
      <!-- Pool de audios superpuestos (modo overlap): son <video> ocultos, ver nota. -->
      <div id="voices"></div>
      <!-- Cartel de la alerta de prueba. -->
      <div id="toast"></div>
    </div>

    <script>
      // El servidor reemplaza este marcador por la versión del overlay (un hash
      // corto). Si la página quedó cacheada en OBS, el WebSocket manda una
      // versión distinta y el overlay se recarga solo.
      window.__OVERLAY_VERSION__ = /*__OVERLAY_VERSION__*/ "";
    </script>
    <script>
      /*
       * Máquina de estados del overlay: idle -> loading -> playing <-> paused.
       * Invariante: todo mensaje (play, stop, pause, resume, error, reconexión)
       * termina en un estado conocido y NUNCA deja una marca de "ocupado" activa.
       * Un "play" nuevo siempre reemplaza al anterior (generación).
       */
      const video = document.getElementById("clip");
      const voicesHost = document.getElementById("voices");
      const toast = document.getElementById("toast");
      let toastTimer = null;

      // Muestra un cartel breve (alerta de prueba). No lo lee nadie más y no
      // afecta a la reproducción en curso.
      function showToast(text) {
        toast.textContent = text;
        toast.classList.add("show");
        if (toastTimer !== null) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove("show");
          toastTimer = null;
        }, 2500);
      }

      // Clave del overlay: viaja en la URL de esta página (?key=...) y se reenvía
      // al WebSocket y a los clips, porque el Browser Source de OBS no comparte
      // la cookie del dashboard.
      const overlayKey = new URLSearchParams(location.search).get("key") || "";
      /**
       * URL de reproducción de un clip. El servidor SIEMPRE la resuelve (mp4 o
       * m4a, según el archivo) y la manda en el mensaje (`play` y `state`). El
       * overlay no debe adivinarla: un `.mp4` fijo dejaba sin reproducir los
       * clips de audio. Si no viene URL, se devuelve `null` y la reproducción
       * falla de forma visible en vez de pedir un archivo inexistente.
       */
      function mediaUrl(explicitUrl) {
        return typeof explicitUrl === "string" && explicitUrl ? explicitUrl : null;
      }

      /** Keyframes de entrada; la salida es la misma animación al revés. */
      const ENTER = {
        none: [{ opacity: 1 }, { opacity: 1 }],
        fade: [{ opacity: 0 }, { opacity: 1 }],
        "slide-up": [
          { opacity: 0, transform: "translateY(30px)" },
          { opacity: 1, transform: "translateY(0)" },
        ],
        "slide-down": [
          { opacity: 0, transform: "translateY(-30px)" },
          { opacity: 1, transform: "translateY(0)" },
        ],
        zoom: [
          { opacity: 0, transform: "scale(0.8)" },
          { opacity: 1, transform: "scale(1)" },
        ],
      };

      const LOAD_TIMEOUT_MS = 8000; // si la metadata no llega, no dejar el seek colgado
      const MIN_RECONNECT_MS = 1000;
      const MAX_RECONNECT_MS = 10000;

      let mode = "idle"; // idle | loading | playing | paused
      let current = null;
      let generation = 0; // invalida callbacks de un play anterior
      let retriedMuted = false;
      let remainingMs = 0;
      let endDeadline = 0;
      let anim = null;
      let endTimer = null;
      let loadTimer = null;
      let onMeta = null;
      let reconnectTimer = null;
      let reconnectDelay = MIN_RECONNECT_MS;
      let ws = null;

      // Estado global de reproducción (controles "Solo audio" y "Modo Chill" del
      // panel de Cola). El servidor lo manda al conectar y cuando cambia. Se aplica
      // al INICIO de cada alerta: no reinicia ni corta la que ya está sonando.
      let globalPlayback = { audioOnly: false, volume: 1 };

      // --- Versión del overlay y recarga automática ---------------------------
      // El servidor embebe la versión en la página y la manda en el primer
      // mensaje del WebSocket. Si difieren, esta página quedó vieja (caché de OBS
      // o del navegador) y se recarga sola, con protección contra bucles.
      const overlayVersion = window.__OVERLAY_VERSION__ || "";
      const RELOAD_MIN_INTERVAL_MS = 10000;
      let lastReloadAt = 0;
      let reloadAttempted = false;

      function checkVersion(serverVersion) {
        if (!serverVersion || !overlayVersion || serverVersion === overlayVersion) return;
        if (reloadAttempted) {
          // Ya se recargó una vez y sigue distinto: no insistir para no
          // entrar en un bucle de recargas.
          console.error(
            `[overlay] versión del servidor (${serverVersion}) distinta tras recargar ` +
              `(página ${overlayVersion}); se deja de intentar.`,
          );
          return;
        }
        const now = Date.now();
        if (now - lastReloadAt < RELOAD_MIN_INTERVAL_MS) return;
        lastReloadAt = now;
        reloadAttempted = true;
        console.warn(`[overlay] recargando por versión (${overlayVersion} -> ${serverVersion})`);
        location.reload();
      }

      // --- Diagnóstico (nivel debug) ------------------------------------------
      // Sin la clave del overlay: la URL se manda sin `?key=`. Se registra en el
      // servidor solo con CZERO_DEBUG.
      function urlWithoutKey(url) {
        return String(url || "").split("?")[0];
      }

      function sendConnectionDiag() {
        send({
          type: "diag",
          diag: {
            kind: "connection",
            version: overlayVersion,
            userAgent: navigator.userAgent,
            canPlay: {
              'audio/mp4; codecs="mp4a.40.2"': video.canPlayType('audio/mp4; codecs="mp4a.40.2"'),
              'video/mp4; codecs="avc1.42E01E, mp4a.40.2"': video.canPlayType(
                'video/mp4; codecs="avc1.42E01E, mp4a.40.2"',
              ),
              "audio/x-m4a": video.canPlayType("audio/x-m4a"),
            },
          },
        });
      }

      // Marca el momento de cada evento del reproductor para el diagnóstico de
      // la reproducción en curso.
      let playbackDiag = null;
      function trackPlayback(itemId, url) {
        playbackDiag = { itemId: itemId, url: urlWithoutKey(url), events: {} };
      }
      for (const evt of ["loadedmetadata", "canplay", "playing", "ended", "error"]) {
        video.addEventListener(evt, () => {
          if (!playbackDiag) return;
          if (playbackDiag.events[evt] === undefined) playbackDiag.events[evt] = Math.round(performance.now());
        });
      }

      function sendPlaybackDiag() {
        const diag = playbackDiag;
        if (!diag) return;
        const err = video.error;
        send({
          type: "diag",
          diag: {
            kind: "playback",
            version: overlayVersion,
            url: diag.url,
            readyState: video.readyState,
            networkState: video.networkState,
            errorCode: err ? err.code : null,
            errorMessage: err ? err.message : null,
            events: diag.events,
          },
        });
      }

      function send(message) {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(message));
      }

      function clearEndTimer() {
        if (endTimer !== null) clearTimeout(endTimer);
        endTimer = null;
      }

      function clearLoadTimer() {
        if (loadTimer !== null) clearTimeout(loadTimer);
        loadTimer = null;
        if (onMeta) {
          video.removeEventListener("loadedmetadata", onMeta);
          onMeta = null;
        }
      }

      function clearTimers() {
        clearEndTimer();
        clearLoadTimer();
      }

      function effectiveSec(item) {
        const p = item.params;
        const start = Math.max(0, Number(p.trimStart) || 0);
        const naturalEnd = typeof p.trimEnd === "number" ? p.trimEnd : Infinity;
        const end = Math.min(naturalEnd, start + Math.max(1, p.maxDurationSec));
        return Math.max(0.1, end - start);
      }

      function place(item) {
        // Modo global "Solo audio": fuerza a que la alerta suene sin mostrar la
        // imagen. Se muta la copia local del ítem por reproducción, así el resto
        // del código (animaciones, visibilidad, fin) usa el valor efectivo y el
        // toggle no afecta a la alerta que ya está sonando.
        if (globalPlayback.audioOnly) item.params.audioOnly = true;
        // La posición X/Y ya no se aplica: el video llena el área de la fuente.
        video.volume = Math.min(1, Math.max(0, item.params.volume * globalVolumeFactor()));
        video.style.display = "block";
        video.muted = false;
        // Cada reproducción decide si se ve la imagen (no queda pegado de la
        // anterior). Con "solo audio" se oculta con `visibility: hidden` (NO
        // `display: none`): el elemento sigue en el flujo, el audio suena, el
        // recorte y la duración máxima aplican y `ended`/`error` siguen llegando.
        video.style.visibility = item.params.audioOnly ? "hidden" : "visible";
      }

      // Factor de volumen global (Modo Chill): multiplica el volumen individual
      // de cada alerta. 1 = sin atenuación; si no llegó un valor válido, no atenúa.
      function globalVolumeFactor() {
        const value = Number(globalPlayback.volume);
        return Number.isFinite(value) ? Math.min(1, Math.max(0, value)) : 1;
      }

      // Aplica el estado global que manda el servidor (solo audio y factor de
      // volumen). Ignora cualquier forma inesperada para no romper la reproducción.
      function applyGlobalPlayback(next) {
        if (!next || typeof next !== "object") return;
        const volume = Number(next.volume);
        globalPlayback = {
          audioOnly: next.audioOnly === true,
          volume: Number.isFinite(volume) ? volume : 1,
        };
      }

      function animateIn(name) {
        // "Solo audio": sin animación (no hay imagen que animar).
        if (current && current.params.audioOnly) return;
        if (anim) anim.cancel();
        anim = video.animate(ENTER[name] ?? ENTER.fade, {
          duration: 300,
          easing: "ease-out",
          fill: "forwards",
        });
      }

      function animateOut(name) {
        if (current && current.params.audioOnly) return;
        if (anim) anim.cancel();
        anim = video.animate([...(ENTER[name] ?? ENTER.fade)].reverse(), {
          duration: 250,
          easing: "ease-in",
          fill: "forwards",
        });
      }

      function seekTo(seconds) {
        try {
          video.currentTime = seconds;
        } catch {
          /* el video aún no está listo para el seek */
        }
      }

      /** Oculta el video (salida animada) sin tocar `current` ni `mode`. */
      function hide(exitAnimation, audioOnly) {
        clearEndTimer();
        if (!audioOnly) animateOut(exitAnimation ?? "fade");
        video.pause();
        setTimeout(() => {
          if (mode === "idle") {
            video.style.display = "none";
            // Al ocultar de verdad, se rearma la visibilidad para la próxima
            // reproducción (cada `place` la vuelve a fijar de todas formas).
            video.style.visibility = "visible";
          }
        }, audioOnly ? 0 : 250);
      }

      /** Estado terminal de un clip: avisa el fin y vuelve a idle. */
      function finish(itemId, reason) {
        if (!current || current.id !== itemId) return;
        const finishedId = itemId;
        const exitAnimation = current.params.exitAnimation;
        const wasAudioOnly = current.params.audioOnly === true;
        sendPlaybackDiag();
        current = null;
        mode = "idle";
        clearTimers();
        send({ type: "ended", itemId: finishedId, reason: reason });
        hide(exitAnimation, wasAudioOnly);
      }

      function failPlayback(gen, error) {
        if (gen !== generation || !current) return;
        const itemId = current.id;
        // Reportar el error al servidor; el watchdog del servidor es la red de
        // seguridad si aun así no llega el fin.
        send({ type: "error", itemId: itemId, message: String(error) });
        if (retriedMuted) {
          finish(itemId, "no se pudo reproducir");
          return;
        }
        // Reintento único en silencio (muted), por si es una política de autoplay.
        retriedMuted = true;
        video.muted = true;
        const again = video.play();
        if (!again || typeof again.then !== "function") {
          onPlayStarted(gen, remainingMs / 1000);
          return;
        }
        again
          .then(() => {
            if (gen === generation) onPlayStarted(gen, remainingMs / 1000);
          })
          .catch((second) => {
            if (gen === generation) {
              finish(itemId, "no se pudo reproducir (muted): " + String(second));
            }
          });
      }

      function onPlayStarted(gen, playForSec) {
        if (gen !== generation || !current) return;
        mode = "playing";
        remainingMs = Math.max(0, playForSec * 1000);
        endDeadline = performance.now() + remainingMs;
        animateIn(current.params.enterAnimation);
        clearEndTimer();
        // Corta el video aunque no haya terminado (recorte o duración máxima).
        endTimer = setTimeout(() => {
          if (gen === generation) finish(current ? current.id : "", "duración");
        }, remainingMs);
      }

      function startPlayback(gen) {
        const attempt = video.play();
        if (!attempt || typeof attempt.then !== "function") {
          onPlayStarted(gen, remainingMs / 1000);
          return;
        }
        attempt
          .then(() => {
            if (gen === generation) onPlayStarted(gen, remainingMs / 1000);
          })
          .catch((error) => failPlayback(gen, error));
      }

      /** Reproduce un clip desde cero (o reemplaza al que esté en curso). */
      function play(item, explicitUrl) {
        const gen = ++generation;
        clearTimers();
        current = item;
        mode = "loading";
        retriedMuted = false;
        remainingMs = effectiveSec(item) * 1000;
        place(item);

        const url = mediaUrl(explicitUrl);
        if (!url) {
          // Sin URL no se pide nada: se reporta y se libera el turno.
          finish(item.id, "el servidor no envió la URL del medio");
          return;
        }
        if (video.getAttribute("src") !== url) video.setAttribute("src", url);
        trackPlayback(item.id, url);

        const start = Math.max(0, Number(item.params.trimStart) || 0);
        const begin = () => {
          if (gen !== generation) return;
          seekTo(start);
          startPlayback(gen);
        };

        if (video.readyState >= 1) {
          begin();
        } else {
          onMeta = () => {
            clearLoadTimer();
            begin();
          };
          video.addEventListener("loadedmetadata", onMeta, { once: true });
          loadTimer = setTimeout(() => {
            clearLoadTimer();
            if (gen !== generation) return;
            // Sin metadata: no dejar el seek esperando para siempre.
            finish(item.id, "timeout de carga");
          }, LOAD_TIMEOUT_MS);
        }
      }

      /** Carga un clip y lo deja detenido (estado pausado). */
      function hold(item, explicitUrl) {
        const gen = ++generation;
        clearTimers();
        current = item;
        mode = "paused";
        retriedMuted = false;
        remainingMs = effectiveSec(item) * 1000;
        place(item);

        const url = mediaUrl(explicitUrl);
        if (!url) {
          finish(item.id, "el servidor no envió la URL del medio");
          return;
        }
        if (video.getAttribute("src") !== url) video.setAttribute("src", url);

        const start = Math.max(0, Number(item.params.trimStart) || 0);
        const park = () => {
          if (gen !== generation) return;
          seekTo(start);
          video.pause();
        };
        if (video.readyState >= 1) park();
        else {
          onMeta = () => {
            clearLoadTimer();
            park();
          };
          video.addEventListener("loadedmetadata", onMeta, { once: true });
          loadTimer = setTimeout(clearLoadTimer, LOAD_TIMEOUT_MS);
        }
      }

      function stop() {
        generation += 1; // invalida callbacks pendientes
        clearTimers();
        mode = "idle";
        const exitAnimation = current ? current.params.exitAnimation : "fade";
        const wasAudioOnly = !!(current && current.params.audioOnly);
        current = null;
        hide(exitAnimation, wasAudioOnly);
      }

      /* ----------------------------------------------------------------------
       * Voces superpuestas (modo overlap). El pool es INDEPENDIENTE del
       * reproductor de video: no entra en la cola y no lo afectan Saltar,
       * Pausar, Reanudar ni Vaciar. Se usa <video> oculto (no <audio>) porque el
       * medio es un mp4 con audio y video: así el navegador siempre decodifica el
       * audio del contenedor, sin depender del soporte de mp4 en <audio>.
       * Cada voz se libera al terminar, al llegar al recorte, a la duración
       * máxima, por error o al cortarse (si se supera el máximo de voces).
       */
      const voices = []; // { id, el, timer, loadTimer, released }

      function releaseVoice(voice, notify) {
        if (!voice || voice.released) return;
        // `notify`: el audio llegó a su fin natural (terminó, recorte o duración
        // máxima). No se avisa si se cortó por tope de voces o por un stop. El
        // servidor lo usa para contar la espera global del Modo Chill.
        if (notify) send({ type: "audioEnded", itemId: voice.id });
        voice.released = true;
        if (voice.timer !== null) clearTimeout(voice.timer);
        if (voice.loadTimer !== null) clearTimeout(voice.loadTimer);
        try {
          voice.el.pause();
        } catch {
          /* el elemento ya se fue */
        }
        voice.el.removeAttribute("src");
        try {
          voice.el.load();
        } catch {
          /* no-op */
        }
        voice.el.remove();
        const index = voices.indexOf(voice);
        if (index >= 0) voices.splice(index, 1);
      }

      function releaseAllVoices() {
        for (const voice of [...voices]) releaseVoice(voice);
      }

      function playAudio(audio) {
        if (!audio || !audio.url) return;
        const maxVoices = Math.max(1, Math.floor(Number(audio.maxVoices) || 1));
        // Si ya hay el máximo de voces, se corta la más antigua (la primera).
        while (voices.length >= maxVoices) releaseVoice(voices[0]);

        const el = document.createElement("video");
        el.setAttribute("playsinline", "");
        el.preload = "auto";
        el.style.display = "none";
        el.volume = Math.min(1, Math.max(0, Number(audio.volume) || 0) * globalVolumeFactor());
        el.src = audio.url;

        const voice = { id: audio.id, el: el, timer: null, loadTimer: null, released: false };
        voices.push(voice);
        voicesHost.appendChild(el);

        const start = Math.max(0, Number(audio.trimStart) || 0);
        const naturalEnd = typeof audio.trimEnd === "number" ? audio.trimEnd : Infinity;
        const capSec = Math.min(naturalEnd, start + Math.max(0.1, Number(audio.maxDurationSec) || 0.1));

        const begin = () => {
          if (voice.released) return;
          clearLoadTimerFor(voice);
          try {
            el.currentTime = start;
          } catch {
            /* todavía no listo para el seek */
          }
          const attempt = el.play();
          if (attempt && typeof attempt.then === "function") {
            attempt.catch((error) => {
              send({ type: "error", itemId: audio.id, message: "audio: " + String(error) });
              releaseVoice(voice);
            });
          }
          // Corta al llegar al recorte o a la duración máxima.
          voice.timer = setTimeout(() => releaseVoice(voice, true), Math.max(100, (capSec - start) * 1000));
        };

        function clearLoadTimerFor(target) {
          if (target.loadTimer !== null) clearTimeout(target.loadTimer);
          target.loadTimer = null;
        }

        el.addEventListener("ended", () => releaseVoice(voice, true));
        el.addEventListener("error", () => {
          send({ type: "error", itemId: audio.id, message: "audio: no se pudo cargar" });
          releaseVoice(voice);
        });

        if (el.readyState >= 1) {
          begin();
        } else {
          el.addEventListener("loadedmetadata", begin, { once: true });
          voice.loadTimer = setTimeout(() => {
            if (voice.released) return;
            send({ type: "error", itemId: audio.id, message: "audio: timeout de carga" });
            releaseVoice(voice);
          }, LOAD_TIMEOUT_MS);
        }
      }

      function pause() {
        if (mode === "playing") remainingMs = Math.max(0, endDeadline - performance.now());
        clearEndTimer();
        video.pause();
        mode = "paused";
      }

      function resume() {
        if (!current) return;
        const gen = generation;
        mode = "playing";
        video.muted = false;
        const attempt = video.play();
        if (!attempt || typeof attempt.then !== "function") {
          onPlayStarted(gen, remainingMs / 1000);
          return;
        }
        attempt
          .then(() => {
            if (gen === generation) onPlayStarted(gen, remainingMs / 1000);
          })
          .catch((error) => failPlayback(gen, error));
      }

      video.addEventListener("ended", () => {
        if (mode === "playing" && current) finish(current.id, "ended");
      });

      function handle(message) {
        switch (message.type) {
          case "state": {
            const st = message.state || {};
            if (typeof message.version === "string") checkVersion(message.version);
            if (st.status === "paused" && st.current) {
              // En pausa: cargar el clip y dejarlo detenido.
              if (!current || current.id !== st.current.id) hold(st.current, message.url);
              else pause();
            } else if (st.status === "playing" && st.current) {
              // Al (re)conectar se reinicia el clip en curso desde el principio
              // (decisión documentada en docs/dashboard.md).
              play(st.current, message.url);
            } else {
              stop();
            }
            break;
          }
          case "play":
            play(message.item, message.url);
            break;
          case "stop":
            stop();
            break;
          case "pause":
            pause();
            break;
          case "resume":
            resume();
            break;
          case "playAudio":
            playAudio(message.audio);
            break;
          case "stopAudio":
            releaseAllVoices();
            break;
          case "global":
            applyGlobalPlayback(message.global);
            break;
          case "test":
            showToast(typeof message.text === "string" ? message.text : "Alerta de prueba");
            break;
        }
      }

      function connect() {
        ws = new WebSocket("ws://" + location.host + "/ws?key=" + encodeURIComponent(overlayKey));
        ws.addEventListener("open", () => {
          reconnectDelay = MIN_RECONNECT_MS;
          send({ type: "ready" });
          sendConnectionDiag();
        });
        ws.addEventListener("message", (event) => {
          try {
            handle(JSON.parse(event.data));
          } catch (error) {
            console.warn("[overlay] mensaje descartado:", error);
          }
        });
        // Reconexión automática con backoff; al reconectar, el servidor reenvía
        // el estado actual y el overlay se pone al día.
        ws.addEventListener("close", () => {
          stop();
          releaseAllVoices();
          if (reconnectTimer !== null) clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(connect, reconnectDelay);
          reconnectDelay = Math.min(MAX_RECONNECT_MS, reconnectDelay * 2);
        });
        ws.addEventListener("error", () => ws.close());
      }

      connect();
    </script>
  </body>
