<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VIUrewards overlay</title>
    <!-- Evita el 404 de /favicon.ico dentro del Browser Source. -->
    <link rel="icon" href="data:," />
    <style>
      /* Fondo transparente: es un Browser Source que se compone sobre el video. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      /* El video llena el área de la fuente (Browser Source) respetando su
         relación de aspecto. Las barras sobrantes son transparentes, no negras.
         El tamaño y la ubicación de la alerta se ajustan en OBS moviendo y
         redimensionando la fuente. La posición X/Y de la recompensa ya no se
         aplica (queda reservada para más adelante). */
      #anchor {
        position: absolute;
        inset: 0;
      }
      #clip {
        display: none;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="anchor">
        <video id="clip" playsinline></video>
      </div>
      <!-- Pool de audios superpuestos (modo overlap): son <video> ocultos, ver nota. -->
      <div id="voices"></div>
    </div>

    <script>
      /*
       * Máquina de estados del overlay: idle -> loading -> playing <-> paused.
       * Invariante: todo mensaje (play, stop, pause, resume, error, reconexión)
       * termina en un estado conocido y NUNCA deja una marca de "ocupado" activa.
       * Un "play" nuevo siempre reemplaza al anterior (generación).
       */
      const video = document.getElementById("clip");
      const voicesHost = document.getElementById("voices");

      // Clave del overlay: viaja en la URL de esta página (?key=...) y se reenvía
      // al WebSocket y a los clips, porque el Browser Source de OBS no comparte
      // la cookie del dashboard.
      const overlayKey = new URLSearchParams(location.search).get("key") || "";
      /**
       * URL de reproducción de un clip. El servidor la resuelve (mp4 o m4a,
       * según el archivo) y la manda en el mensaje `play`. Cuando no viene
       * (por ejemplo el `state` que se envía al reconectar), se asume mp4: el
       * servidor informará el error de carga si el archivo no existe.
       */
      function mediaUrl(clipId, explicitUrl) {
        if (explicitUrl) return explicitUrl;
        return "/media/" + encodeURIComponent(clipId) + ".mp4?key=" + encodeURIComponent(overlayKey);
      }

      /** Keyframes de entrada; la salida es la misma animación al revés. */
      const ENTER = {
        none: [{ opacity: 1 }, { opacity: 1 }],
        fade: [{ opacity: 0 }, { opacity: 1 }],
        "slide-up": [
          { opacity: 0, transform: "translateY(30px)" },
          { opacity: 1, transform: "translateY(0)" },
        ],
        "slide-down": [
          { opacity: 0, transform: "translateY(-30px)" },
          { opacity: 1, transform: "translateY(0)" },
        ],
        zoom: [
          { opacity: 0, transform: "scale(0.8)" },
          { opacity: 1, transform: "scale(1)" },
        ],
      };

      const LOAD_TIMEOUT_MS = 8000; // si la metadata no llega, no dejar el seek colgado
      const MIN_RECONNECT_MS = 1000;
      const MAX_RECONNECT_MS = 10000;

      let mode = "idle"; // idle | loading | playing | paused
      let current = null;
      let generation = 0; // invalida callbacks de un play anterior
      let retriedMuted = false;
      let remainingMs = 0;
      let endDeadline = 0;
      let anim = null;
      let endTimer = null;
      let loadTimer = null;
      let onMeta = null;
      let reconnectTimer = null;
      let reconnectDelay = MIN_RECONNECT_MS;
      let ws = null;

      function send(message) {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(message));
      }

      function clearEndTimer() {
        if (endTimer !== null) clearTimeout(endTimer);
        endTimer = null;
      }

      function clearLoadTimer() {
        if (loadTimer !== null) clearTimeout(loadTimer);
        loadTimer = null;
        if (onMeta) {
          video.removeEventListener("loadedmetadata", onMeta);
          onMeta = null;
        }
      }

      function clearTimers() {
        clearEndTimer();
        clearLoadTimer();
      }

      function effectiveSec(item) {
        const p = item.params;
        const start = Math.max(0, Number(p.trimStart) || 0);
        const naturalEnd = typeof p.trimEnd === "number" ? p.trimEnd : Infinity;
        const end = Math.min(naturalEnd, start + Math.max(1, p.maxDurationSec));
        return Math.max(0.1, end - start);
      }

      function place(item) {
        // La posición X/Y ya no se aplica: el video llena el área de la fuente.
        video.volume = Math.min(1, Math.max(0, item.params.volume));
        video.style.display = "block";
        video.muted = false;
        // Cada reproducción decide si se ve la imagen (no queda pegado de la
        // anterior). Con "solo audio" se oculta con `visibility: hidden` (NO
        // `display: none`): el elemento sigue en el flujo, el audio suena, el
        // recorte y la duración máxima aplican y `ended`/`error` siguen llegando.
        video.style.visibility = item.params.audioOnly ? "hidden" : "visible";
      }

      function animateIn(name) {
        // "Solo audio": sin animación (no hay imagen que animar).
        if (current && current.params.audioOnly) return;
        if (anim) anim.cancel();
        anim = video.animate(ENTER[name] ?? ENTER.fade, {
          duration: 300,
          easing: "ease-out",
          fill: "forwards",
        });
      }

      function animateOut(name) {
        if (current && current.params.audioOnly) return;
        if (anim) anim.cancel();
        anim = video.animate([...(ENTER[name] ?? ENTER.fade)].reverse(), {
          duration: 250,
          easing: "ease-in",
          fill: "forwards",
        });
      }

      function seekTo(seconds) {
        try {
          video.currentTime = seconds;
        } catch {
          /* el video aún no está listo para el seek */
        }
      }

      /** Oculta el video (salida animada) sin tocar `current` ni `mode`. */
      function hide(exitAnimation, audioOnly) {
        clearEndTimer();
        if (!audioOnly) animateOut(exitAnimation ?? "fade");
        video.pause();
        setTimeout(() => {
          if (mode === "idle") {
            video.style.display = "none";
            // Al ocultar de verdad, se rearma la visibilidad para la próxima
            // reproducción (cada `place` la vuelve a fijar de todas formas).
            video.style.visibility = "visible";
          }
        }, audioOnly ? 0 : 250);
      }

      /** Estado terminal de un clip: avisa el fin y vuelve a idle. */
      function finish(itemId, reason) {
        if (!current || current.id !== itemId) return;
        const finishedId = itemId;
        const exitAnimation = current.params.exitAnimation;
        const wasAudioOnly = current.params.audioOnly === true;
        current = null;
        mode = "idle";
        clearTimers();
        send({ type: "ended", itemId: finishedId, reason: reason });
        hide(exitAnimation, wasAudioOnly);
      }

      function failPlayback(gen, error) {
        if (gen !== generation || !current) return;
        const itemId = current.id;
        // Reportar el error al servidor; el watchdog del servidor es la red de
        // seguridad si aun así no llega el fin.
        send({ type: "error", itemId: itemId, message: String(error) });
        if (retriedMuted) {
          finish(itemId, "no se pudo reproducir");
          return;
        }
        // Reintento único en silencio (muted), por si es una política de autoplay.
        retriedMuted = true;
        video.muted = true;
        const again = video.play();
        if (!again || typeof again.then !== "function") {
          onPlayStarted(gen, remainingMs / 1000);
          return;
        }
        again
          .then(() => {
            if (gen === generation) onPlayStarted(gen, remainingMs / 1000);
          })
          .catch((second) => {
            if (gen === generation) {
              finish(itemId, "no se pudo reproducir (muted): " + String(second));
            }
          });
      }

      function onPlayStarted(gen, playForSec) {
        if (gen !== generation || !current) return;
        mode = "playing";
        remainingMs = Math.max(0, playForSec * 1000);
        endDeadline = performance.now() + remainingMs;
        animateIn(current.params.enterAnimation);
        clearEndTimer();
        // Corta el video aunque no haya terminado (recorte o duración máxima).
        endTimer = setTimeout(() => {
          if (gen === generation) finish(current ? current.id : "", "duración");
        }, remainingMs);
      }

      function startPlayback(gen) {
        const attempt = video.play();
        if (!attempt || typeof attempt.then !== "function") {
          onPlayStarted(gen, remainingMs / 1000);
          return;
        }
        attempt
          .then(() => {
            if (gen === generation) onPlayStarted(gen, remainingMs / 1000);
          })
          .catch((error) => failPlayback(gen, error));
      }

      /** Reproduce un clip desde cero (o reemplaza al que esté en curso). */
      function play(item, explicitUrl) {
        const gen = ++generation;
        clearTimers();
        current = item;
        mode = "loading";
        retriedMuted = false;
        remainingMs = effectiveSec(item) * 1000;
        place(item);

        const url = mediaUrl(item.clipId, explicitUrl);
        if (video.getAttribute("src") !== url) video.setAttribute("src", url);

        const start = Math.max(0, Number(item.params.trimStart) || 0);
        const begin = () => {
          if (gen !== generation) return;
          seekTo(start);
          startPlayback(gen);
        };

        if (video.readyState >= 1) {
          begin();
        } else {
          onMeta = () => {
            clearLoadTimer();
            begin();
          };
          video.addEventListener("loadedmetadata", onMeta, { once: true });
          loadTimer = setTimeout(() => {
            clearLoadTimer();
            if (gen !== generation) return;
            // Sin metadata: no dejar el seek esperando para siempre.
            finish(item.id, "timeout de carga");
          }, LOAD_TIMEOUT_MS);
        }
      }

      /** Carga un clip y lo deja detenido (estado pausado). */
      function hold(item, explicitUrl) {
        const gen = ++generation;
        clearTimers();
        current = item;
        mode = "paused";
        retriedMuted = false;
        remainingMs = effectiveSec(item) * 1000;
        place(item);

        const url = mediaUrl(item.clipId, explicitUrl);
        if (video.getAttribute("src") !== url) video.setAttribute("src", url);

        const start = Math.max(0, Number(item.params.trimStart) || 0);
        const park = () => {
          if (gen !== generation) return;
          seekTo(start);
          video.pause();
        };
        if (video.readyState >= 1) park();
        else {
          onMeta = () => {
            clearLoadTimer();
            park();
          };
          video.addEventListener("loadedmetadata", onMeta, { once: true });
          loadTimer = setTimeout(clearLoadTimer, LOAD_TIMEOUT_MS);
        }
      }

      function stop() {
        generation += 1; // invalida callbacks pendientes
        clearTimers();
        mode = "idle";
        const exitAnimation = current ? current.params.exitAnimation : "fade";
        const wasAudioOnly = !!(current && current.params.audioOnly);
        current = null;
        hide(exitAnimation, wasAudioOnly);
      }

      /* ----------------------------------------------------------------------
       * Voces superpuestas (modo overlap). El pool es INDEPENDIENTE del
       * reproductor de video: no entra en la cola y no lo afectan Saltar,
       * Pausar, Reanudar ni Vaciar. Se usa <video> oculto (no <audio>) porque el
       * medio es un mp4 con audio y video: así el navegador siempre decodifica el
       * audio del contenedor, sin depender del soporte de mp4 en <audio>.
       * Cada voz se libera al terminar, al llegar al recorte, a la duración
       * máxima, por error o al cortarse (si se supera el máximo de voces).
       */
      const voices = []; // { id, el, timer, loadTimer, released }

      function releaseVoice(voice) {
        if (!voice || voice.released) return;
        voice.released = true;
        if (voice.timer !== null) clearTimeout(voice.timer);
        if (voice.loadTimer !== null) clearTimeout(voice.loadTimer);
        try {
          voice.el.pause();
        } catch {
          /* el elemento ya se fue */
        }
        voice.el.removeAttribute("src");
        try {
          voice.el.load();
        } catch {
          /* no-op */
        }
        voice.el.remove();
        const index = voices.indexOf(voice);
        if (index >= 0) voices.splice(index, 1);
      }

      function releaseAllVoices() {
        for (const voice of [...voices]) releaseVoice(voice);
      }

      function playAudio(audio) {
        if (!audio || !audio.url) return;
        const maxVoices = Math.max(1, Math.floor(Number(audio.maxVoices) || 1));
        // Si ya hay el máximo de voces, se corta la más antigua (la primera).
        while (voices.length >= maxVoices) releaseVoice(voices[0]);

        const el = document.createElement("video");
        el.setAttribute("playsinline", "");
        el.preload = "auto";
        el.style.display = "none";
        el.volume = Math.min(1, Math.max(0, Number(audio.volume) || 0));
        el.src = audio.url;

        const voice = { id: audio.id, el: el, timer: null, loadTimer: null, released: false };
        voices.push(voice);
        voicesHost.appendChild(el);

        const start = Math.max(0, Number(audio.trimStart) || 0);
        const naturalEnd = typeof audio.trimEnd === "number" ? audio.trimEnd : Infinity;
        const capSec = Math.min(naturalEnd, start + Math.max(0.1, Number(audio.maxDurationSec) || 0.1));

        const begin = () => {
          if (voice.released) return;
          clearLoadTimerFor(voice);
          try {
            el.currentTime = start;
          } catch {
            /* todavía no listo para el seek */
          }
          const attempt = el.play();
          if (attempt && typeof attempt.then === "function") {
            attempt.catch((error) => {
              send({ type: "error", itemId: audio.id, message: "audio: " + String(error) });
              releaseVoice(voice);
            });
          }
          // Corta al llegar al recorte o a la duración máxima.
          voice.timer = setTimeout(() => releaseVoice(voice), Math.max(100, (capSec - start) * 1000));
        };

        function clearLoadTimerFor(target) {
          if (target.loadTimer !== null) clearTimeout(target.loadTimer);
          target.loadTimer = null;
        }

        el.addEventListener("ended", () => releaseVoice(voice));
        el.addEventListener("error", () => {
          send({ type: "error", itemId: audio.id, message: "audio: no se pudo cargar" });
          releaseVoice(voice);
        });

        if (el.readyState >= 1) {
          begin();
        } else {
          el.addEventListener("loadedmetadata", begin, { once: true });
          voice.loadTimer = setTimeout(() => {
            if (voice.released) return;
            send({ type: "error", itemId: audio.id, message: "audio: timeout de carga" });
            releaseVoice(voice);
          }, LOAD_TIMEOUT_MS);
        }
      }

      function pause() {
        if (mode === "playing") remainingMs = Math.max(0, endDeadline - performance.now());
        clearEndTimer();
        video.pause();
        mode = "paused";
      }

      function resume() {
        if (!current) return;
        const gen = generation;
        mode = "playing";
        video.muted = false;
        const attempt = video.play();
        if (!attempt || typeof attempt.then !== "function") {
          onPlayStarted(gen, remainingMs / 1000);
          return;
        }
        attempt
          .then(() => {
            if (gen === generation) onPlayStarted(gen, remainingMs / 1000);
          })
          .catch((error) => failPlayback(gen, error));
      }

      video.addEventListener("ended", () => {
        if (mode === "playing" && current) finish(current.id, "ended");
      });

      function handle(message) {
        switch (message.type) {
          case "state": {
            const st = message.state || {};
            if (st.status === "paused" && st.current) {
              // En pausa: cargar el clip y dejarlo detenido.
              if (!current || current.id !== st.current.id) hold(st.current);
              else pause();
            } else if (st.status === "playing" && st.current) {
              // Al (re)conectar se reinicia el clip en curso desde el principio
              // (decisión documentada en docs/dashboard.md).
              play(st.current);
            } else {
              stop();
            }
            break;
          }
          case "play":
            play(message.item, message.url);
            break;
          case "stop":
            stop();
            break;
          case "pause":
            pause();
            break;
          case "resume":
            resume();
            break;
          case "playAudio":
            playAudio(message.audio);
            break;
          case "stopAudio":
            releaseAllVoices();
            break;
        }
      }

      function connect() {
        ws = new WebSocket("ws://" + location.host + "/ws?key=" + encodeURIComponent(overlayKey));
        ws.addEventListener("open", () => {
          reconnectDelay = MIN_RECONNECT_MS;
          send({ type: "ready" });
        });
        ws.addEventListener("message", (event) => {
          try {
            handle(JSON.parse(event.data));
          } catch (error) {
            console.warn("[overlay] mensaje descartado:", error);
          }
        });
        // Reconexión automática con backoff; al reconectar, el servidor reenvía
        // el estado actual y el overlay se pone al día.
        ws.addEventListener("close", () => {
          stop();
          releaseAllVoices();
          if (reconnectTimer !== null) clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(connect, reconnectDelay);
          reconnectDelay = Math.min(MAX_RECONNECT_MS, reconnectDelay * 2);
        });
        ws.addEventListener("error", () => ws.close());
      }

      connect();
    </script>
  </body>
</html>
